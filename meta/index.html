
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Analysis</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="meta.js"></script>
</head>

<body>
  <h1>Code Analysis</h1>

  <p>
    Exploring the development and structure of my portfolio
    through data visualization.
  </p>

  <!-- Filtering slider -->
  <div class="filter-container">
    <label>
      Show commits until:
      <input
        type="range"
        id="commit-progress"
        min="0"
        max="100"
        value="100"
      />
      <time id="commit-time"></time>
    </label>
  </div>

  <!-- Summary statistics -->
  <div id="stats"></div>

  <!-- Lab 8 - Step 3: Scrollytelling -->
  <div id="scrolly-1">

    <!-- Left side: Commit descriptions -->
    <div id="scatter-story"></div>

    <!-- Right side: Scatter plot -->
    <div id="scatter-plot">

      <h2>Commits by time of day</h2>
      <div id="chart"></div>

      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>

    </div>

  </div>

  <!-- Commit tooltip -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a id="commit-link" href="" target="_blank"
         rel="noopener noreferrer"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="tooltip-commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines</dt>
    <dd id="commit-lines"></dd>
  </dl>

  <!-- File visualization -->
  <dl id="files"></dl>

</body>
</html>
